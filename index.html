const root=document.getElementById('balotario-quiz');const config={topic:{value:'Todos'},count:{value:'99'},mode:{value:'learn'}};const el=id=>config[id]||root.querySelector('#b-'+id);
const bank=raw.map((r,id)=>({id,topic:r[0],page:r[1],q:r[2],opts:r.slice(3,6),why:r[6]}));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
let s={ids:[],i:0,correct:0,points:0,miss:[],choice:null,order:[],mode:'learn'},timer=null,deadline=0;
const synth=window.speechSynthesis;
let speechToken=0,advanceTimer=null,voices=[],utterance=null;
function stopSpeech(){speechToken++;clearTimeout(advanceTimer);if(synth)synth.cancel();utterance=null;}
function voiceList(){if(!synth||!window.SpeechSynthesisUtterance){el('audio').checked=false;el('audio').disabled=true;el('audio-status').textContent='La voz no está disponible en este navegador. Puedes leer la explicación y pulsar Siguiente.';return;}voices=synth.getVoices().filter(v=>/^es([_-]|$)/i.test(v.lang));const selected=el('voice').value;el('voice').replaceChildren();const first=document.createElement('option');first.value='';first.textContent='Automática (prioriza Google)';el('voice').append(first);voices.forEach(v=>{const o=document.createElement('option');o.value=v.voiceURI;o.textContent=v.name+' · '+v.lang;el('voice').append(o);});el('voice').value=voices.some(v=>v.voiceURI===selected)?selected:'';el('audio-status').textContent=voices.some(v=>/google/i.test(v.name))?'Voz de Google en español disponible.':'Se usará la voz en español disponible en el navegador.';}
function next(){stopSpeech();s.i++;s.choice=null;s.order=[];render();save();}
function explain(){stopSpeech();if(s.choice===null||s.i>=s.ids.length)return;const q=bank[s.ids[s.i]],token=speechToken;if(!el('audio').checked||!synth||!window.SpeechSynthesisUtterance){el('audio-status').textContent='Lee la explicación y pulsa Siguiente.';return;}const prefix=s.choice===0?'Correcto. ':s.choice===-1?'Se acabó el tiempo. ':'Respuesta incorrecta. ';const text='La respuesta correcta es: '+q.opts[0]+'. '+q.why;
utterance=new window.SpeechSynthesisUtterance(text.replace(/≥/g,' mayor o igual a ').replace(/≤/g,' menor o igual a ').replace(/>/g,' mayor a ').replace(/°C/g,' grados Celsius ').replace(/−/g,' menos ').replace(/(\d)[–](\d)/g,'$1 a $2'));
utterance.lang='es-PE';utterance.rate=1;utterance.voice=voices.find(v=>v.voiceURI===el('voice').value)||voices.find(v=>/google/i.test(v.name))||voices.find(v=>/^es-PE$/i.test(v.lang))||voices[0]||null;
utterance.onstart=()=>{if(token===speechToken)el('audio-status').textContent='Explicando…';};utterance.onend=()=>{if(token!==speechToken)return;el('audio-status').textContent='Explicación terminada.';if(el('auto').checked)advanceTimer=setTimeout(()=>{if(token===speechToken)next();},1000);};utterance.onerror=()=>{if(token===speechToken)el('audio-status').textContent='No se pudo reproducir la voz. Pulsa Escuchar otra vez o Siguiente.';};try{synth.speak(utterance);}catch{el('audio-status').textContent='La voz está bloqueada en este navegador. Puedes pulsar Siguiente.';}}
function save(){}
function action(label,fn){const b=document.createElement('button');b.type='button';b.className='btn btn-primary';b.textContent=label;b.onclick=fn;el('actions').append(b);}
function start(ids){stopSpeech();clearInterval(timer);const topic=el('topic').value;const pool=ids||bank.filter(q=>topic==='Todos'||q.topic===topic).map(q=>q.id);s={ids:shuffle(pool).slice(0,ids?ids.length:Number(el('count').value)),i:0,correct:0,points:0,miss:[],choice:null,order:[],mode:el('mode').value};render();save();}
function render(){clearInterval(timer);el('answers').replaceChildren();el('actions').replaceChildren();el('feedback').replaceChildren();
const pct=s.ids.length?Math.round(s.i/s.ids.length*100):0;el('bar').style.width=pct+'%';el('progress').setAttribute('aria-valuenow',pct);
if(!s.ids.length){el('question').textContent=`${bank.length} preguntas listas`;el('source').textContent='HT175 · versión 23 · 24/02/2026';el('status').textContent='Rondas cortas · Opciones al azar · Repite tus errores';return;}
if(s.i>=s.ids.length){el('question').textContent=`Ronda terminada: ${s.correct}/${s.ids.length} aciertos`;el('source').textContent='HT175 · versión 23 · 24/02/2026';el('status').textContent=`${Math.round(s.correct/s.ids.length*100)}% · ${s.points} puntos`;el('feedback').textContent=s.miss.length?`${s.miss.length} preguntas por reforzar.`:'¡Todas correctas!';if(s.miss.length)action('Repetir mis errores',()=>start([...s.miss]));action('Nueva ronda',()=>start());return;}
const q=bank[s.ids[s.i]];if(!s.order.length)s.order=shuffle([0,1,2]);el('source').textContent=`${q.topic} · PDF, página ${q.page}`;el('question').textContent=q.q;
el('status').textContent=`Pregunta ${s.i+1}/${s.ids.length} · ${s.correct} aciertos · ${s.points} puntos`;
s.order.forEach((n,j)=>{const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=`${'ABC'[j]}. ${q.opts[n]}`;b.disabled=s.choice!==null;b.onclick=()=>answer(n);if(s.choice!==null&&n===0)b.textContent+=' ✓ Correcta';else if(s.choice===n)b.textContent+=' ✗ Tu respuesta';el('answers').append(b);});
if(s.choice!==null){el('feedback').textContent=(s.choice===0?'¡Correcto! ':s.choice===-1?'Se acabó el tiempo. ':'Respuesta incorrecta. ')+q.why;action(s.i===s.ids.length-1?'Ver resultado':'Siguiente',next);if(synth)action('Escuchar otra vez',explain);}
else if(s.mode==='speed'){deadline=Date.now()+30000;const t=document.createElement('span');t.className='tabular-nums';el('status').append(t);const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));t.textContent=` · ${left} s`;if(!left)answer(-1);};tick();timer=setInterval(tick,250);}
}
function answer(n){if(s.choice!==null)return;clearInterval(timer);s.choice=n;if(n===0){s.correct++;s.points+=s.mode==='speed'?500+Math.round(Math.max(0,deadline-Date.now())/60):1000;}else s.miss.push(s.ids[s.i]);render();save();explain();}
function restore(state){const x=state?.privateContent?.quiz;if(x&&Array.isArray(x.ids)&&x.ids.every(id=>Number.isInteger(id)&&bank[id])&&Number.isInteger(x.i)&&x.i>=0&&x.i<=x.ids.length&&Array.isArray(x.order)&&Array.isArray(x.miss)){s=x;el('mode').value=s.mode;render();}}
el('audio').onchange=()=>{if(!el('audio').checked)stopSpeech();};el('auto').onchange=()=>{if(!el('auto').checked)clearTimeout(advanceTimer);};voiceList();if(synth)synth.addEventListener('voiceschanged',voiceList);start();
})();
</script>
